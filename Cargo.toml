[package]
name = "blockeater-game"
version = "0.1.0"
edition = "2021"
authors = ["Blockeater Contributors"]
description = "A 2D arcade-style game aggressively optimized in Rust"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
