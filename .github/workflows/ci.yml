name: Build and Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
jobs:
  codeql:
    name: "CodeQL Security Scan"
    runs-on: ubuntu-latest
    permissions:
      actions: read      # Required for the action to read workflow metadata
      contents: read      # Required to check out the code
      security-events: write # Required to upload CodeQL results

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        # If you wish to specify a different query suite, add it here.
        # queries: security-extended

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev libgtest-dev libsdl2-ttf-dev

    # Autobuild attempts to build any compiled languages  (C/C++, C#, Go, Java, or Swift).
    # If this step fails, you may need to replace it with custom build steps.
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  gitleaks:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for gitleaks to scan the full repository history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Note: The following jobs run in parallel with the CodeQL scan.
  # You could make them dependent on the scan if you prefer a sequential workflow.
  # For example:
  #   needs: codeql

  cpp-lint:
    name: "C++ Linter"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      # Install bear to generate compile_commands.json from the Makefile
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev libgtest-dev libsdl2-ttf-dev clang-tidy bear

    - name: Generate compilation database
      # Use bear to wrap the 'make' command and generate compile_commands.json
      working-directory: .
      run: bear -- make

    - name: Run clang-tidy
      # This command runs clang-tidy on all source files found by the file glob.
      # The -p option now points to the directory where 'bear' created the file.
      # The --warnings-as-errors='*' flag will cause the step to fail if any warnings are found.
      run: clang-tidy --warnings-as-errors='*' -p . ./src/*.cpp ./config/*.cpp

  cpp-test:
    name: "C++ Tests"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev libgtest-dev libsdl2-ttf-dev

    - name: Configure CMake
      # We run cmake from the test directory, as it contains the correct CMakeLists.txt
      run: cmake -S ./test -B ./test/build

    - name: Build
      run: cmake --build ./test/build

    - name: Run tests
      # Use a dummy video driver for SDL in a headless environment
      env:
        SDL_VIDEODRIVER: dummy
      run: |
        cd ./test/build
        ctest --verbose
